[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsbsim-f16-cuda"
version = "0.1.0"
description = "JSBSim 1.3.0 F-16 flight model (f16.xml + F100 + FLCS) ported to batched PyTorch/CUDA"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
verify = ["jsbsim==1.3.0"]

[tool.setuptools]
packages = ["jsbsim_f16_cuda"]

[tool.setuptools.package-data]
jsbsim_f16_cuda = ["*.npz"]
